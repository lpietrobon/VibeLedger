name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  roadmap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/roadmap/requirements.txt
      - name: Install roadmap scanner
        run: python -m pip install -r docs/roadmap/requirements.txt
      - name: Validate roadmap metadata
        run: python docs/roadmap/scan.py
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install backend dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run backend tests
        run: python -m pytest --cov --cov-report=term-missing --cov-report=json:backend-coverage.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend-coverage.json
          if-no-files-found: warn
          retention-days: 7
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/Los_Angeles
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Run frontend tests
        run: npm test
      - name: Build production frontend
        run: npm run build
      - name: Upload production frontend
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7
